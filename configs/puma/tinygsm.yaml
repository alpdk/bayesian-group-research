# PUMA TinyGSM L=256 (from PUMA/yaml_files/tinygsm_puma_256.yaml).
# Launch: PUMA/launch_tinygsm256.sh  (CFG=yaml_files/tinygsm_puma_256.yaml)

model:
  vocab_size: 151645
  hidden_size: 512
  intermediate_size: 1536
  num_layers: 14
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 256
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_lm_head: true
  causal: false
  arm_init: "none"

training:
  strategy: "progressive"
  diffusion_layout: "full"
  mode: "confidence_collapse"
  confidence_threshold: 0.9
  eos_id: 151643
  K: 21
  reference_length: 256
  block_size: 256
  k_schedule:
    - [21, 0]
    - [20, 30000]
    - [18, 60000]
    - [17, 90000]
    - [15, 120000]
    - [14, 150000]
    - [12, 180000]
    - [11, 210000]
    - [9, 240000]
    - [8, 270000]
    - [6, 300000]
  data_ratio: 1.0
  learning_rate: 3.0e-4
  weight_decay: 0.01
  num_epochs: 20
  max_steps: 260000
  max_grad_norm: 1.0
  batch_size: 64
  warmup_steps: 1000
  logging_steps: 100
  eval_steps: 2000
  save_steps: 2000
  ema: 0.9999
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 0.0

validation:
  val_dir: "none"
  sampling:
    temperature: 0.0
    confidence: ["top_k"]
    unmasking_num: [1, 2, 4, 8]
    eos_id: 151643

data:
  mask_id: 151644
  dataset: "tinygsm"
  data_dir: "data/tiny_gsm_256"
  val_ratio: 0.02
  seed: 2026
  training:
    per_gpu_batch_size: ${training.batch_size}
    cpus: 4

wandb:
  wandb: true
  project: "edit-diffusion"
  name: "puma-tinygsm-L256-shared-params"
  entity: alpdk-podkopaev
  group: shared-params
