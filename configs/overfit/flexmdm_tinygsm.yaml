# 2-example TinyGSM overfit with generate+score on the same rows.
hydra:
  data: tinygsm
  algo: flexmdm-anyorder
  model: flexmdm_anyorder
  sampling: default
  noise: linear
  lr_scheduler: constant_warmup
  strategy: single-device

sampling:
  steps: 128

model:
  length: 256
  hidden_size: 768
  n_blocks: 12
  n_heads: 12
  dropout: 0.0

data:
  max_examples: 2
  val_ratio: 0.0

loader:
  global_batch_size: 2
  eval_global_batch_size: 2
  num_workers: 1

trainer:
  devices: 1
  num_nodes: 1
  max_steps: 4000
  val_check_interval: 500
  precision: bf16
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  num_sanity_val_steps: 0

eval:
  task: tinygsm
  transfer_task: tinygsm
  task_num_samples: 2
  task_checkpoint_monitor: "test/pass@1_k1"
  generate_samples: true
  pass_at_1_k: [1]

lr_scheduler:
  num_warmup_steps: 10

optim:
  lr: 1.0e-3
  weight_decay: 0.0

training:
  ema: 0.0

seed: 42

wandb:
  project: edit-diffusion
  entity: alpdk-podkopaev
  name: flexmdm-tinygsm-overfit2
  group: overfit-5

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 4000
  early_stopping:
    patience: 9999
  sample_saver:
    enabled: false

checkpointing:
  resume_from_ckpt: false

hydra_run_dir: ./outputs/overfit/flexmdm-tinygsm-2
