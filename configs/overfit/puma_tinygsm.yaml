# 2-example TinyGSM overfit with generate+score on the same packed rows.
# Vanilla MDM (not progressive) so the 2 rows can actually be memorized.
# Pretokenize with: python data/tiny_gsm.py --out_dir data/tiny_gsm_256_overfit2 --max_len 256 --limit 2
model:
  vocab_size: 151645
  hidden_size: 768
  intermediate_size: 2048
  num_layers: 12
  num_attention_heads: 12
  num_kv_heads: 12
  max_position: 256
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_lm_head: true
  causal: false
  arm_init: "none"

training:
  strategy: "standard"
  diffusion_layout: "full"
  mode: "confidence_collapse"
  confidence_threshold: 0.9
  eos_id: 151643
  K: 21
  reference_length: 256
  block_size: 256
  k_schedule:
    - [21, 0]
  data_ratio: 1.0
  learning_rate: 1.0e-3
  weight_decay: 0.0
  num_epochs: 4000
  max_steps: 4000
  max_grad_norm: 1.0
  batch_size: 2
  warmup_steps: 10
  lr_schedule: constant
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  ema: null
  early_stopping:
    enabled: false
    patience: 9999
    min_delta: 0.0

validation:
  val_dir: "none"
  eval_train: true
  sampling:
    temperature: 0.0
    confidence: ["top_k"]
    unmasking_num: [1]
    eos_id: 151643

data:
  mask_id: 151644
  dataset: "tinygsm"
  data_dir: "data/tiny_gsm_256_overfit2"
  val_ratio: 0.0
  seed: 42
  training:
    per_gpu_batch_size: ${training.batch_size}
    cpus: 0

wandb:
  wandb: true
  project: "edit-diffusion"
  name: "puma-tinygsm-overfit2"
  entity: alpdk-podkopaev
  group: overfit-5
