# 80-example TinyGSM smoke (20 steps, 1 GPU). Not a comparison run.
hydra:
  data: tinygsm
  algo: flexmdm-anyorder
  model: flexmdm_anyorder
  sampling: default
  noise: linear
  lr_scheduler: constant_warmup
  strategy: single-device

sampling:
  steps: 8

model:
  length: 256
  hidden_size: 768
  n_blocks: 12
  n_heads: 12
  dropout: 0.1

data:
  max_examples: 80
  val_ratio: 0.2

loader:
  global_batch_size: 8
  eval_global_batch_size: 8
  num_workers: 1

trainer:
  devices: 1
  num_nodes: 1
  max_steps: 20
  val_check_interval: 10
  precision: bf16
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  num_sanity_val_steps: 0

eval:
  task: tinygsm
  transfer_task: null
  task_num_samples: 4
  task_checkpoint_monitor: "test/pass@1_k1"
  generate_samples: false
  pass_at_1_k: [1]

lr_scheduler:
  num_warmup_steps: 2

optim:
  lr: 3.0e-4
  weight_decay: 0.03

training:
  ema: 0.0

seed: 42

wandb:
  project: edit-diffusion
  entity: alpdk-podkopaev
  name: flexmdm-tinygsm-smoke
  group: smoke

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 20
  early_stopping:
    patience: 9999
  sample_saver:
    enabled: false

checkpointing:
  resume_from_ckpt: false

hydra_run_dir: ./outputs/smoke/flexmdm-tinygsm
