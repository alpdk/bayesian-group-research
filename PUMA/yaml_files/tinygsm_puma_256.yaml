model:
  vocab_size: 151645
  hidden_size: 512
  intermediate_size: 1536
  num_layers: 14
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 256
  rms_norm_eps: 1e-6
  dropout: 0.0
  tie_lm_head: true # we tie the weights as QWen2 vocab size ~ 150k
  causal: false      # if true, uses causal attention mask
  arm_init: "none" # initialize MDM from ARM. Set to "none" to disable

training:
  strategy: "progressive"
  diffusion_layout: "full"
  mode: "confidence_collapse"
  confidence_threshold: 0.9
  eos_id: 151643
  K: 21 # nominal tokens unmasked per stage at reference_length
  reference_length: 256
  block_size: 256
  # K values halved vs the length-512 config to preserve the stage-count progression
  k_schedule:
    - [21, 0]
    - [20, 30000]
    - [18, 60000]
    - [17, 90000]
    - [15, 120000]
    - [14, 150000]
    - [12, 180000]
    - [11, 210000]
    - [9, 240000]
    - [8, 270000]
    - [6, 300000]
  data_ratio: 1.0
  learning_rate: 3e-4
  weight_decay: 0.01
  num_epochs: 20
  max_steps: 260000
  max_grad_norm: 1.0
  batch_size: 64
  warmup_steps: 1000
  logging_steps: 100
  eval_steps: 2000
  save_steps: 2000
  ema: 0.9999 # same as MDLM. Leave empty to disable EMA
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 0.0

validation:
  val_dir: "none" # gsm8k eval loop is self-included
  sampling:
    temperature: 0.0
    confidence: ["top_k"]
    unmasking_num: [2, 3]
    eos_id: 151643
  
data:
  mask_id: 151644
  dataset: "tinygsm"
  data_dir: "data/tiny_gsm_256"
  val_ratio: 0.02
  seed: 2026
  training:
    per_gpu_batch_size: ${training.batch_size}
    cpus: 4

wandb:
  wandb: true
  project: "edit-diffusion"
  name: "puma-tinygsm-256"
  entity: null # null = default entity of the logged-in wandb user
